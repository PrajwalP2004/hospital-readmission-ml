services:
  - type: web
    name: medpredict
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && npm install && npm run build
    startCommand: gunicorn server.app:app --bind 0.0.0.0:$PORT --workers 2 --timeout 120
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRY_HOURS
        value: "24"
      - key: ADMIN_PASSWORD
        generateValue: true
      - key: DATABASE_PATH
        value: "./medpredict.db"
      - key: CORS_ORIGINS
        value: "https://medpredict.onrender.com,http://localhost:5173,http://localhost:3000"
      - key: FLASK_DEBUG
        value: "0"
      - key: NODE_VERSION
        value: "20"
      - key: PYTHON_VERSION
        value: "3.11.11"
